name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: set -o pipefail; swift test 2>&1 | tee build.log
      - run: set -o pipefail; sh scripts/bundle.sh 2>&1 | tee -a build.log
      # the failing lines go into one annotation, readable without downloading the log
      - if: failure()
        run: |
          msg=$(grep -E "error:|failed|XCTAssert" build.log | sort -u | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=build log::$msg"
      - run: ditto -c -k --keepParent build/EasyPad.app EasyPad.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPad
          path: EasyPad.zip
